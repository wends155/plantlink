[package]
name = "plantlink-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
plantlink-core = { path = "../plantlink-core" }
rhai = { version = "1.16", features = ["sync", "serde"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
anyhow = "1.0"
async-trait = "0.1.89"
tokio-stream = "0.1.18"
futures = "0.3.31"
async-nats = "0.46.0"
uuid = { version = "1.20.0", features = ["v4"] }
bytes = "1.11.0"
once_cell = "1.21.3"
