[package]
name = "plantlink-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tokio = { version = "1.0", features = ["full"] }
async-nats = "0.46.0"
rumqttc = "0.24"
tokio-modbus = { version = "0.10", default-features = false, features = ["tcp"] }
bytes = "1.0"
base64ct = "=1.6.0"
rand = "=0.8.5"
rand_core = "=0.6.4"
anyhow = "1.0"
thiserror = "1.0"
time = "=0.3.36"
chrono = { version = "0.4.43", features = ["serde"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
