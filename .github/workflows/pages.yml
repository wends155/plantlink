name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout archive
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust API Documentation
        run: cargo doc --no-deps --workspace

      - name: Prepare Deploy Directory
        run: |
          mkdir deploy
          cp -r site/* deploy/
          mkdir deploy/api
          cp -r target/doc/* deploy/api/
          
          # Add a redirect for the bare /api/ path matching our primary crate
          cat << 'EOF' > deploy/api/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta http-equiv="refresh" content="0; url=plantlink_core/index.html">
              <title>Redirecting to API Docs</title>
          </head>
          <body>
              Redirecting to <a href="plantlink_core/index.html">API Docs</a>...
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
