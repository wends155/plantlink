[package]
name = "plantlink-web"
version = "0.1.0"
edition = "2024"

[dependencies]
plantlink-core = { path = "../plantlink-core" }
plantlink-runtime = { path = "../plantlink-runtime" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
rust-embed = "8.0"
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
anyhow = "1.0"
tower-http = { version = "0.6.8", features = ["trace"] }
futures = "0.3.31"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait = "0.1"

[lints]
workspace = true
