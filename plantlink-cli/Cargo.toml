[package]
name = "plantlink-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
plantlink-runtime = { path = "../plantlink-runtime" }
plantlink-web = { path = "../plantlink-web" }
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"

[lints]
workspace = true
