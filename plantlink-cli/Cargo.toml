[package]
name = "plantlink-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
plantlink-core = { path = "../plantlink-core" }
plantlink-runtime = { path = "../plantlink-runtime" }
plantlink-web = { path = "../plantlink-web" }
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
chrono = "0.4.43"
